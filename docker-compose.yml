services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017/pms
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-pms-demo-access-secret-change-before-production-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-pms-demo-refresh-secret-change-before-production-2026}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_DAYS: 7
      ADMIN_NAME: ${ADMIN_NAME:-PMS Administrator}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@login}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pms.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin@123}
      MEMBER_NAME: ${MEMBER_NAME:-PMS Project Member}
      MEMBER_USERNAME: ${MEMBER_USERNAME:-login@pms}
      MEMBER_EMAIL: ${MEMBER_EMAIL:-login@pms.local}
      MEMBER_PASSWORD: ${MEMBER_PASSWORD:-pms@123}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - pms_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pms_mongo:
